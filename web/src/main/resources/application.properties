spring.application.name=TicTacToe

spring.datasource.url=jdbc:postgresql://localhost:5434/tic-tac-toe
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tic-tac-toe
spring.datasource.password=mysecretpassword
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#spring.flyway.baseline-on-migrate=true
#spring.flyway.locations=classpath:db/migration
server.port=8080

#openrouter.key-path=/Users/sylwiabarteczko/Desktop/Pliki/TicTacToe/openrouter.key

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=demo-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

tictactoe.kafka.topic=tictactoe.events
tictactoe.kafka.groupId=tictactoe-reporting
