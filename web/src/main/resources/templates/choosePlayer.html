<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Choose Game Mode</title>
    <link th:href="@{/css/game.css}" rel="stylesheet">
</head>
<body>
<h1>Choose Game Mode</h1>

<div>
    <form th:action="@{/game/new}" method="get">
        <input type="hidden" name="mode" value="HUMAN">
        <button type="submit">👥 Play with another player</button>
    </form>

    <form th:if="${aiAvailable}" th:action="@{/game/new}" method="get">
        <input type="hidden" name="mode" value="AI">
        <button type="submit">🤖 Play vs AI</button>
    </form>

    <div th:unless="${aiAvailable}">
        <button disabled>🤖 Play vs AI</button>
        <p class="turn-message">
            AI mode is unavailable. To enable it, add your
            <a href="https://openrouter.ai" target="_blank">OpenRouter API key</a>
            to the application configuration.
        </p>
    </div>
</div>

<a href="/game/list-games">Back to Game List</a>
</body>
</html>
